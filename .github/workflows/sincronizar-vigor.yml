name: Sincronizar Vigor -> Entrega Fácil

on:
  # O horário é controlado pelo Supabase (pg_cron: jobs vigor-sync-30min e vigor-sync-final),
  # que dispara este robô a cada 30 min, das 8h07 às 18h07, de segunda a sábado.
  # O agendamento do próprio GitHub atrasava e pulava rodadas, por isso foi desligado.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só simular (não grava nada no Entrega Fácil)"
        type: boolean
        default: false
      dias:
        description: "NFs emitidas nos últimos N dias"
        type: string
        default: "5"

concurrency:
  group: vigor-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reaproveitar bibliotecas da rodada anterior
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Sincronizar
        run: npm run sync
        env:
          VIGOR_USUARIO: ${{ secrets.VIGOR_USUARIO }}
          VIGOR_SENHA: ${{ secrets.VIGOR_SENHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DIAS_JANELA: ${{ github.event.inputs.dias || '5' }}
